name: CI

# DrawTabData's own checks (RFC #45). The DrawTabDataExplorer runs the same
# data checks when its submodule pointer moves; this catches problems in the
# data PR itself, before any consumer picks it up.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: with core.autocrlf=true a checkout used to turn
        # data files CRLF. .gitattributes forces LF; this proves it.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Checks that never write come first, so a stale or non-canonical
      # committed file fails here instead of being silently regenerated.
      - name: Line endings (LF in index and working tree)
        shell: bash
        run: |
          bad=$(git ls-files --eol -- '*.json' | grep -v "i/lf.*w/lf" || true)
          if [ -n "$bad" ]; then echo "Not LF:"; echo "$bad"; exit 1; fi

      - name: Data format
        run: npm run format-data

      - name: Generated bundles match their sources
        run: npm run generate

      # @thesevenpens/queriton is an (optional) peer dependency: inside the
      # Explorer it resolves to the workspace copy, and it isn't on the public
      # npm registry. Check it out and link it the way the workspace does
      # (it has no runtime dependencies of its own). `npm install --no-save
      # github:...` silently does nothing for a declared peer, hence the link.
      - name: Checkout queriton (peer dependency)
        uses: actions/checkout@v6
        with:
          repository: TheSevenPens/queriton
          ref: e80b3d89a62ad322c492f54f78e06b89096e0c46
          path: .queriton

      - name: Link queriton
        run: node -e "const fs=require('fs'),p=require('path');fs.mkdirSync('node_modules/@thesevenpens',{recursive:true});fs.symlinkSync(p.resolve('.queriton'),'node_modules/@thesevenpens/queriton','junction')"

      - name: Type-check
        run: npm run typecheck

      - name: Type-check scripts
        run: npm run typecheck:scripts

      - name: Tests
        run: npm test

      - name: Data quality
        run: npm run data-quality
